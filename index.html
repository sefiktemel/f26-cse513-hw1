<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Scheduling Simulator</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <h1>CPU Scheduling Simulator</h1>

    <section>
        <h2>Processes</h2>

        <table id="processTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Arrival</th>
                    <th>Burst</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <button id="addProcessBtn">Add Process</button>
    </section>

    <section>
        <h2>Scheduler Settings</h2>

        <select id="algorithm">
            <option value="FCFS">FCFS</option>
            <option value="SJF">SJF</option>
            <option value="SRTF">SRTF</option>
            <option value="RR">Round Robin</option>
        </select>

        <label for="quantum">Time Quantum (Round Robin only):</label>
        <input
            type="number"
            id="quantum"
            min="1"
            value="2"
            placeholder="Quantum">

        <button id="loadWorkloadA">Load Workload A</button>
        <button id="loadWorkloadB">Load Workload B</button>

        <button id="runBtn">Run Simulation</button>
    </section>

    <section>
        <h2>Gantt Chart</h2>
        <div id="ganttChart"></div>
    </section>

    <section>
        <h2>Results</h2>
        <div id="results"></div>
    </section>

    <script type="module" src="./js/app.js"></script>

</body>
</html>
